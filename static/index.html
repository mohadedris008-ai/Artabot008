<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>میز اختصاصی پاسور و سکوئنس</title>
    <!-- اسکریپت ضروری تلگرام مینی اپ -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background-color: #1e293b;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 85%;
            max-width: 400px;
        }
        h2 {
            color: #38bdf8;
            margin-bottom: 12px;
            font-size: 20px;
        }
        #status {
            font-size: 14px;
            color: #fbbf24;
            margin-top: 15px;
            padding: 8px;
            border-radius: 8px;
            background: rgba(251, 191, 36, 0.1);
        }
        .online {
            color: #4ade80 !important;
            background: rgba(74, 222, 128, 0.1) !important;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>میز اختصاصی پاسور و سکوئنس</h2>
        <div id="status">در حال اتصال به شبکه بازی...</div>
    </div>

    <script>
        // ۱. مقداردهی اولیه‌ی تلگرام
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // ۲. استخراج مشخصات کاربر یا ساخت شناسه موقت
        const userId = tg?.initDataUnsafe?.user?.id || "user_" + Math.floor(Math.random() * 10000);
        const roomId = "room1";

        // ۳. ساخت آدرس امن وب‌سوکت (تغییر ws به wss در صورت استفاده از https)
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}/ws/game/${roomId}/${userId}`;

        const statusDiv = document.getElementById("status");

        // ۴. ایجاد اتصال WebSocket
        const socket = new WebSocket(wsUrl);

        socket.onopen = function(e) {
            statusDiv.innerText = "ارتباط برقرار شد! خوش آمدید.";
            statusDiv.classList.add("online");
            console.log("WebSocket connected successfully.");
        };

        socket.onmessage = function(event) {
            const data = JSON.parse(event.data);
            console.log("دریافت داده از سرور:", data);
        };

        socket.onerror = function(error) {
            statusDiv.innerText = "خطا در اتصال به شبکه! در حال تلاش مجدد...";
            console.error("WebSocket Error:", error);
        };

        socket.onclose = function(event) {
            statusDiv.innerText = "قطع ارتباط با سرور!";
            statusDiv.classList.remove("online");
        };
    </script>
</body>
</html>
